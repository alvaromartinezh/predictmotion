<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Tile de patrón de fondo (balón/banderín/copa/dado). Blanco = visible vía
       CSS mask-mode:luminance; negro = agujero; el color real lo pone la
       custom property de acento en el elemento enmascarado (ver styles.css). -->
  <g fill="#fff">
    <!-- balón -->
    <g transform="translate(45 50) rotate(-10)">
      <circle r="16"/>
      <g fill="#000">
        <circle cx="0" cy="-8" r="2.2"/>
        <circle cx="7.6" cy="-2.5" r="2.2"/>
        <circle cx="4.7" cy="6.5" r="2.2"/>
        <circle cx="-4.7" cy="6.5" r="2.2"/>
        <circle cx="-7.6" cy="-2.5" r="2.2"/>
      </g>
    </g>
    <!-- banderín de córner -->
    <g transform="translate(152 42) rotate(14)">
      <rect x="-1.5" y="-20" width="3" height="40" rx="1.5"/>
      <polygon points="1.5,-20 23,-13 1.5,-6"/>
    </g>
    <!-- copa -->
    <g transform="translate(50 152)">
      <path d="M -14,-18 L 14,-18 L 9,2 L -9,2 Z"/>
      <circle cx="-16" cy="-13" r="4"/>
      <circle cx="16" cy="-13" r="4"/>
      <rect x="-2.5" y="2" width="5" height="10"/>
      <rect x="-10" y="12" width="20" height="5" rx="1.5"/>
    </g>
    <!-- dado -->
    <g transform="translate(153 155) rotate(18)">
      <rect x="-16" y="-16" width="32" height="32" rx="6"/>
      <g fill="#000">
        <circle cx="-8" cy="-8" r="2.6"/>
        <circle cx="8" cy="-8" r="2.6"/>
        <circle cx="0" cy="0" r="2.6"/>
        <circle cx="-8" cy="8" r="2.6"/>
        <circle cx="8" cy="8" r="2.6"/>
      </g>
    </g>
  </g>
</svg>
