<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 160 160">
  <!-- Tile de patrón de fondo (camiseta / silbato / botas / portería) con GLOW
       neón. Blanco = visible vía CSS mask-mode:luminance; el halo desenfocado
       (feGaussianBlur) da luminancia parcial → brillo suave alrededor del trazo.
       El color real lo pone la custom property de acento (ver styles.css).
       4 iconos por tile + mask-size pequeño = repetición densa. -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <g id="ic" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <!-- camiseta (arriba izq.) -->
      <g transform="translate(42 44) rotate(-6)"><path d="M -13,-16 L -20,-10 L -25,-4 L -20,3 L -13,-2 L -13,17 L 13,17 L 13,-2 L 20,3 L 25,-4 L 20,-10 L 13,-16 L 6,-16 L 0,-11 L -6,-16 Z"/></g>
      <!-- silbato (arriba der.) -->
      <g transform="translate(118 42) rotate(5)"><circle cx="4" cy="0" r="11"/><path d="M -18,-5 L -6,-5 M -18,5 L -6,5 M -18,-5 L -18,5"/><circle cx="5" cy="-12" r="3.2"/></g>
      <!-- botas (abajo izq.) -->
      <g transform="translate(40 116) rotate(-4)"><path d="M -17,3 L -17,-4 Q -17,-10 -9,-10 L 3,-10 Q 16,-10 18,-1 L 18,3 Z"/><path d="M -13,3 L -13,7 M -6,3 L -6,7 M 1,3 L 1,7 M 8,3 L 8,7 M 15,3 L 15,7"/><path d="M -7,-7 L -3,-4 M -1,-8 L 3,-5 M 5,-8 L 9,-5"/></g>
      <!-- portería con red (abajo der.) -->
      <g transform="translate(118 118)"><path d="M -21,-13 L -21,13 M 21,-13 L 21,13 M -22,-13 L 22,-13"/><g stroke-width="1.3"><path d="M -11,-13 L -11,13 M 0,-13 L 0,13 M 11,-13 L 11,13"/><path d="M -21,-4 L 21,-4 M -21,5 L 21,5"/></g></g>
    </g>
  </defs>
  <!-- halo desenfocado detrás + trazo nítido encima = brillo neón -->
  <use href="#ic" xlink:href="#ic" filter="url(#glow)"/>
  <use href="#ic" xlink:href="#ic"/>
</svg>
