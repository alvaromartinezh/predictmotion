<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Tile de patrón de fondo (balón/banderín/estadio). Blanco = visible vía
       CSS mask-mode:luminance; el color real lo pone la custom property de
       acento en el elemento enmascarado (ver styles.css). -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- balón: círculo + pentágono central + costuras (icono clásico de balón) -->
    <g transform="translate(48 52) rotate(-8)">
      <circle r="16" stroke-width="2.6"/>
      <polygon points="0,-6 5.71,-1.85 3.53,4.85 -3.53,4.85 -5.71,-1.85" stroke-width="2.1"/>
      <line x1="0" y1="-6" x2="0" y2="-16" stroke-width="2.1"/>
      <line x1="5.71" y1="-1.85" x2="15.22" y2="-4.94" stroke-width="2.1"/>
      <line x1="3.53" y1="4.85" x2="9.4" y2="12.94" stroke-width="2.1"/>
      <line x1="-3.53" y1="4.85" x2="-9.4" y2="12.94" stroke-width="2.1"/>
      <line x1="-5.71" y1="-1.85" x2="-15.22" y2="-4.94" stroke-width="2.1"/>
    </g>
    <!-- banderín de córner -->
    <g transform="translate(152 44) rotate(12)">
      <line x1="0" y1="-20" x2="0" y2="20" stroke-width="2.6"/>
      <path d="M 2,-19 L 23,-12.5 L 2,-6 Z" fill="#fff" stroke="none"/>
    </g>
    <!-- estadio: grada ovalada + línea de medio campo + círculo central + focos -->
    <g transform="translate(105 152) rotate(-3)">
      <rect x="-27" y="-16" width="54" height="32" rx="16" stroke-width="2.6"/>
      <line x1="0" y1="-10" x2="0" y2="10" stroke-width="1.7"/>
      <circle cx="0" cy="0" r="5" stroke-width="1.7"/>
      <line x1="-22" y1="-13.5" x2="-26.5" y2="-20" stroke-width="1.8"/>
      <line x1="22" y1="-13.5" x2="26.5" y2="-20" stroke-width="1.8"/>
    </g>
  </g>
</svg>
