<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/media/twitter_profile.png" />
  <link rel="apple-touch-icon" href="/media/twitter_profile.png" />

  <title>Mi cuenta · PredictMotion</title>
  <meta name="description" content="Cuenta de usuario de PredictMotion." />
  <!-- Página de cuenta: no se indexa (CP1, a oscuras, sin enlazar en el sitio). -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#060916" />

  <!-- El botón de Google es la pieza más lenta: empezamos a conectar y a bajar su
       script CUANTO ANTES (preconnect + script async en el head), en paralelo con
       el resto de la página, para que aparezca en <1-2s sin depender del spinner. -->
  <link rel="preconnect" href="https://accounts.google.com" crossorigin />
  <link rel="dns-prefetch" href="https://accounts.google.com" />
  <script src="https://accounts.google.com/gsi/client" async></script>

  <link rel="stylesheet" href="/styles.css?v=20260812g" />
  <link rel="stylesheet" href="/assets/shell.css?v=20260812g" />
  <script src="/theme.js?v=20260812g"></script>
  <script src="/assets/pm-leagues.js?v=20260812g"></script>
  <style>
  main.wrap { max-width: 560px; padding-bottom: var(--sp-9); }
  .account { padding-block: var(--sp-7); }
  .account h1 {
    font-family: var(--font-display); font-weight: 800; text-transform: uppercase;
    font-size: clamp(1.8rem, 4.6vw, var(--fs-36)); line-height: 1.06; margin-bottom: var(--sp-2);
  }
  .account__sub { color: var(--muted); font-family: var(--font-mono); font-size: var(--fs-12); letter-spacing: .12em; text-transform: uppercase; margin-bottom: var(--sp-6); }
  .account .panel { padding: var(--sp-7); }
  .account p { font-size: var(--fs-15); color: var(--text-2); line-height: 1.7; }
  .who { display: flex; align-items: center; gap: var(--sp-4); margin-bottom: var(--sp-5); }
  .who img { width: 56px; height: 56px; border-radius: 50%; }
  .who__name { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-18); color: var(--text); }
  .who__email { color: var(--muted); font-size: var(--fs-13); font-family: var(--font-mono); }
  .btn {
    font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    padding: var(--sp-3) var(--sp-5); border-radius: 10px; cursor: pointer; font-size: var(--fs-14);
  }
  .btn:hover { border-color: var(--accent); }
  .btn-danger { border-color: transparent; color: var(--muted); background: transparent; margin-left: var(--sp-2); font-size: var(--fs-13); }
  .btn-danger:hover { color: #ff7a7a; border-color: #ff7a7a; }
  .msg { margin-top: var(--sp-4); font-size: var(--fs-13); font-family: var(--font-mono); color: var(--muted); }
  .msg.err { color: #ff7a7a; }
  #g_btn { margin-top: var(--sp-4); }
  </style>
</head>
<body>

<!-- Shell del rediseño (modo chrome) alrededor del contenido de la página -->
<div class="pm-app app">
<aside class="sidenav" id="pm-sidenav"></aside>
<div class="app__main">
<header class="appbar" id="pm-appbar"></header>

<main class="wrap account">
  <a class="back-link" href="/">← Volver al inicio</a>
  <h1>Mi cuenta</h1>
  <p class="account__sub">PredictMotion</p>

  <div class="panel">
    <!-- Estado LOGUEADO -->
    <div id="signed-in" hidden>
      <div class="who">
        <img id="who-pic" alt="" referrerpolicy="no-referrer" />
        <div>
          <div class="who__name" id="who-name"></div>
          <div class="who__email" id="who-email"></div>
        </div>
      </div>
      <button class="btn" id="logout-btn" type="button">Cerrar sesión</button>
      <button class="btn btn-danger" id="delete-btn" type="button">Eliminar cuenta</button>
    </div>

    <!-- Estado ANÓNIMO -->
    <div id="signed-out" hidden>
      <p>Inicia sesión para seguir tus equipos y competiciones favoritas.</p>
      <div id="g_btn"></div>
    </div>

    <p class="msg" id="msg">Cargando…</p>
  </div>
</main>

<footer class="footer">
  <div class="wrap footer__inner">
    <p>© 2025 PredictMotion · Todos los derechos reservados</p>
    <nav class="footer__links" aria-label="Enlaces legales">
      <a href="mailto:contact@predictmotion.com">contact@predictmotion.com</a>
      <a href="/privacy">Política de privacidad</a>
    </nav>
  </div>
</footer>

</div><!-- /.app__main -->
</div><!-- /.pm-app.app -->
<div id="shell-tabbar"></div>

<script>
(function () {
  // Base de la API: en producción, mismo origen (Caddy proxya /api/*). En dev
  // (página en :8765) usamos el MISMO host que la página para :8771, para que la
  // cookie de sesión (SameSite=Lax) se considere same-site y viaje en los fetch.
  var API = (location.port === '8765')
    ? (location.protocol + '//' + location.hostname + ':8771')
    : '';
  var $ = function (id) { return document.getElementById(id); };
  var msg = $('msg');
  function say(text, isErr) { msg.textContent = text || ''; msg.className = 'msg' + (isErr ? ' err' : ''); }

  function api(path, opts) {
    opts = opts || {};
    opts.credentials = 'include';           // manda/recibe la cookie de sesión
    return fetch(API + path, opts).then(function (r) { return r.json().catch(function () { return {}; }); });
  }

  function showSignedIn(user) {
    $('signed-out').hidden = true;
    $('signed-in').hidden = false;
    $('who-name').textContent = user.name || user.email || 'Usuario';
    $('who-email').textContent = user.email || '';
    if (user.picture) { $('who-pic').src = user.picture; $('who-pic').hidden = false; }
    else { $('who-pic').hidden = true; }
    say('');
  }

  // Resuelve cuando el script de Google (cargado async en el head) está listo.
  // Sondea en vez de fallar al instante: así el botón se pinta en cuanto GIS
  // termina de cargar, sin depender de un orden de carga concreto.
  function gisReady() {
    return new Promise(function (resolve) {
      function ok() { return window.google && google.accounts && google.accounts.id; }
      if (ok()) return resolve(true);
      var t = setInterval(function () { if (ok()) { clearInterval(t); resolve(true); } }, 40);
      setTimeout(function () { clearInterval(t); resolve(ok()); }, 8000);  // no colgar
    });
  }

  function showSignedOut(clientId, initialMsg) {
    $('signed-in').hidden = true;
    $('signed-out').hidden = false;
    say(initialMsg || 'Cargando el botón de Google…');
    gisReady().then(function (ready) {
      if (ready && clientId) {
        google.accounts.id.initialize({ client_id: clientId, callback: onCredential });
        google.accounts.id.renderButton($('g_btn'), { theme: 'filled_black', size: 'large', text: 'signin_with', shape: 'pill' });
        say(initialMsg || '');
      } else {
        say('El inicio de sesión no está disponible ahora mismo.', true);
      }
    });
  }

  function onCredential(resp) {
    // Login como NAVEGACIÓN top-level (form POST), no fetch: la cookie de sesión
    // del Set-Cookie se commitea de forma fiable en todos los navegadores (móvil
    // incluido). El backend responde 303 → /cuenta (o ?login=error si falla).
    say('Verificando…');
    var f = document.createElement('form');
    f.method = 'POST';
    f.action = API + '/api/auth/google';
    var c = document.createElement('input');
    c.type = 'hidden'; c.name = 'credential'; c.value = resp.credential;
    var n = document.createElement('input');
    n.type = 'hidden'; n.name = 'next'; n.value = location.origin + '/cuenta';
    f.appendChild(c); f.appendChild(n);
    document.body.appendChild(f);
    f.submit();
  }

  $('logout-btn').addEventListener('click', function () {
    say('Cerrando sesión…');
    api('/api/auth/logout', { method: 'POST' }).then(function () {
      loadState();
      if (window.PMAccount) PMAccount.refresh();   // shell vuelve a anónimo al instante
    });
  });

  $('delete-btn').addEventListener('click', function () {
    if (!confirm('¿Eliminar tu cuenta y todas tus preferencias (equipo favorito, equipos y competiciones seguidas)? Esta acción es permanente.')) return;
    say('Eliminando cuenta…');
    api('/api/account', { method: 'DELETE' }).then(function (d) {
      if (d && d.ok) { loadState(); if (window.PMAccount) PMAccount.refresh(); }  // anónimo
      else { say('No se pudo eliminar la cuenta.', true); }
    }).catch(function () { say('Error de red al eliminar la cuenta.', true); });
  });

  function loadState() {
    // Las dos consultas van EN PARALELO (antes eran secuenciales, sumando latencia
    // antes de poder pintar el botón): config (¿feature on? ¿client_id?) y me (¿hay
    // sesión?). Con la respuesta de /api/me se decide signed-in vs signed-out; el
    // botón (si toca) se pinta en cuanto GIS está listo (gisReady), en paralelo.
    Promise.all([api('/api/auth/config'), api('/api/me')]).then(function (res) {
      var cfg = res[0] || {}, me = res[1] || {};
      if (!cfg.enabled) { say('Las cuentas no están disponibles.', true); $('signed-out').hidden = true; return; }
      if (me.ok) { showSignedIn(me.user); }
      else {
        // El 303 de login fallido vuelve a /cuenta?login=error → aviso al usuario.
        var err = (new URLSearchParams(location.search)).get('login') === 'error'
          ? 'No se pudo iniciar sesión. Inténtalo de nuevo.'
          : null;
        showSignedOut(cfg.client_id, err);
      }
    }).catch(function () { say('No se pudo contactar con el servidor.', true); });
  }

  loadState();
})();
</script>
<script src="/assets/account.js?v=20260812g"></script>
<script src="/assets/shell.js?v=20260812g"></script>
<script>PMShell.chrome({ active: null });</script>
</body>
</html>
